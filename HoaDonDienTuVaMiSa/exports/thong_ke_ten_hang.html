<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê tên hàng</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #667085;
      --line: #d9dee7;
      --teal: #23736b;
      --orange: #b45c2e;
      --violet: #5d5fef;
      --shadow: 0 10px 28px rgba(32, 33, 36, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    .app {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      max-width: 900px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .metric .value {
      margin-top: 6px;
      font-size: 26px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="search"] {
      width: min(340px, 52vw);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(35, 115, 107, 0.14);
    }

    button {
      border: 1px solid var(--teal);
      border-radius: 6px;
      padding: 9px 12px;
      background: var(--teal);
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }

    button.secondary {
      background: #fff;
      color: var(--teal);
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--teal);
      border-radius: 6px;
      padding: 9px 12px;
      background: #fff;
      color: var(--teal);
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .table-wrap {
      max-height: calc(100vh - 250px);
      min-height: 420px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eef2f5;
      color: #30343b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      cursor: pointer;
      user-select: none;
    }

    td.number, th.number { text-align: right; }
    th:nth-child(1), td:nth-child(1) { width: 64px; }
    th:nth-child(3), td:nth-child(3) { width: 96px; }
    th:nth-child(4), td:nth-child(4) { width: 150px; }
    th:nth-child(5), td:nth-child(5) { width: 110px; }
    th:nth-child(6), td:nth-child(6) { width: 120px; }

    tbody tr:hover { background: #f4fbfa; }

    .item-name {
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .side {
      display: grid;
      gap: 16px;
    }

    .source-list {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .source {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
    }

    .source strong {
      display: block;
      overflow-wrap: anywhere;
      margin-bottom: 4px;
    }

    .source span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .chart {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      gap: 5px;
    }

    .bar-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #30343b;
      font-size: 13px;
    }

    .bar-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .bar-track {
      height: 10px;
      background: #e8edf1;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      min-width: 2px;
      background: linear-gradient(90deg, var(--teal), var(--orange));
    }

    .muted { color: var(--muted); }

    @media (max-width: 980px) {
      .topbar,
      .panel-head {
        align-items: stretch;
        flex-direction: column;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        max-height: none;
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 20px, 1440px);
        padding-top: 14px;
      }

      h1 { font-size: 20px; }

      .summary {
        grid-template-columns: 1fr;
      }

      input[type="search"] {
        width: 100%;
      }

      .toolbar {
        width: 100%;
      }

      button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

    const csvFileName = "thong_ke_ten_hang.csv";
    let currentRows = [];
    let sortState = { key: "quantity", direction: -1 };

    const searchInput = document.getElementById("searchInput");
    const tableBody = document.getElementById("tableBody");
    const emptyState = document.getElementById("emptyState");
    const visibleSummary = document.getElementById("visibleSummary");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 6 }).format(value || 0);
    }

    function compareRows(a, b) {
      const key = sortState.key;
      const av = a[key];
      const bv = b[key];
      if (typeof av === "number" && typeof bv === "number") {
        return (av - bv) * sortState.direction;
      }
      return String(av ?? "").localeCompare(String(bv ?? ""), "vi", { sensitivity: "base" }) * sortState.direction;
    }

    function applyFilterAndSort() {
      const query = searchInput.value.trim().toLocaleLowerCase("vi");
      currentRows = payload.rows.filter((row) => {
        const text = `${row.name} ${row.unit}`.toLocaleLowerCase("vi");
        return !query || text.includes(query);
      }).sort(compareRows);
      renderTable();
    }

    function renderTable() {
      tableBody.innerHTML = currentRows.map((row, index) => `
        <tr>
          <td class="number">${index + 1}</td>
          <td><div class="item-name">${escapeHtml(row.name)}</div></td>
          <td>${escapeHtml(row.unit)}</td>
          <td class="number">${escapeHtml(row.quantityText)}</td>
          <td class="number">${formatNumber(row.lineCount)}</td>
          <td class="number">${formatNumber(row.invoiceCount)}</td>
        </tr>
      `).join("");

      emptyState.hidden = currentRows.length > 0;
      const visibleQuantity = currentRows.reduce((sum, row) => sum + (row.quantity || 0), 0);
      visibleSummary.textContent = `${formatNumber(currentRows.length)} mặt hàng, tổng số lượng ${formatNumber(visibleQuantity)}`;
    }

    function renderSummary() {
      const firstSource = payload.reports[0] || {};
      document.getElementById("generatedAt").textContent =
        `Tạo lúc ${payload.generatedAt}. Cột tên hàng: ${firstSource.product_column || "AB"}, cột số lượng: ${firstSource.quantity_column || "AE"}.`;
      document.getElementById("itemCount").textContent = formatNumber(payload.summary.itemCount);
      document.getElementById("quantityTotal").textContent = payload.summary.quantityText;
      document.getElementById("lineCount").textContent = formatNumber(payload.summary.lineCount);
      document.getElementById("invoiceCount").textContent = formatNumber(payload.summary.invoiceCount);
    }

    function renderSources() {
      const container = document.getElementById("sources");
      container.innerHTML = payload.reports.map((source) => `
        <div class="source">
          <strong>${escapeHtml(source.file_name)}</strong>
          <span>Sheet: ${escapeHtml(source.sheet_name)}</span>
          <span>Header dòng ${source.header_row}; tên hàng ${source.product_column}; số lượng ${source.quantity_column}</span>
          <span>${formatNumber(source.line_count)} dòng dữ liệu</span>
        </div>
      `).join("");
    }

    function renderChart() {
      const chart = document.getElementById("chart");
      const topRows = [...payload.rows].sort((a, b) => b.quantity - a.quantity).slice(0, 12);
      const maxQuantity = Math.max(...topRows.map((row) => row.quantity), 1);
      chart.innerHTML = topRows.map((row) => {
        const width = Math.max(2, (row.quantity / maxQuantity) * 100);
        return `
          <div class="bar-row" title="${escapeHtml(row.name)}">
            <div class="bar-meta">
              <span class="bar-name">${escapeHtml(row.name)}</span>
              <strong>${escapeHtml(row.quantityText)}</strong>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
          </div>
        `;
      }).join("");
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replace(/"/g, '""')}"`;
    }

    function downloadCsv() {
      const header = ["STT", "Tên hàng", "ĐVT", "Tổng số lượng", "Số dòng", "Số hóa đơn"];
      const rows = currentRows.map((row, index) => [
        index + 1,
        row.name,
        row.unit,
        row.quantityText,
        row.lineCount,
        row.invoiceCount
      ]);
      const csv = [header, ...rows].map((row) => row.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = csvFileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    document.querySelectorAll("th[data-key]").forEach((header) => {
      header.addEventListener("click", () => {
        const key = header.dataset.key;
        sortState = {
          key,
          direction: sortState.key === key ? sortState.direction * -1 : (key === "name" || key === "unit" ? 1 : -1)
        };
        applyFilterAndSort();
      });
    });

    searchInput.addEventListener("input", applyFilterAndSort);
    document.getElementById("resetButton").addEventListener("click", () => {
      searchInput.value = "";
      sortState = { key: "quantity", direction: -1 };
      applyFilterAndSort();
    });
    document.getElementById("downloadButton").addEventListener("click", downloadCsv);

    renderSummary();
    renderSources();
    renderChart();
    applyFilterAndSort();
  </script>
