<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>FB Billing Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f0f2f5;
      color: #1c1e21;
      width: 320px;
    }

    .header {
      background: #1877f2;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
    }

    .header-sub {
      font-size: 11px;
      opacity: 0.8;
    }

    .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

    /* Cards */
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 10px 13px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .card-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #606770;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }

    .row-label { color: #606770; font-size: 12px; }
    .row-value { font-weight: 700; font-size: 13px; }
    .accent    { color: #1877f2; }
    .green     { color: #42b72a; }
    .orange    { color: #f7b928; }

    /* Phase badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      background: #e4e6eb;
      color: #606770;
    }

    .badge.running { background: #e7f3ff; color: #1877f2; }
    .badge.done    { background: #e6f4ea; color: #42b72a; }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot.pulse { animation: pulse .9s infinite; }

    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }

    /* Progress */
    .progress-wrap {
      background: #e4e6eb;
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar {
      height: 100%;
      background: #1877f2;
      border-radius: 99px;
      width: 0%;
      transition: width .3s ease;
    }

    .progress-text {
      font-size: 11px;
      color: #606770;
      margin-top: 4px;
      min-height: 15px;
    }

    /* Page context */
    .page-ctx {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #e4e6eb;
      color: #606770;
    }

    .page-ctx.list    { background: #e7f3ff; color: #1877f2; }
    .page-ctx.detail  { background: #fff3cd; color: #856404; }
    .page-ctx.wrong   { background: #fce8e8; color: #c62828; }
    .page-ctx.running { background: #e6f4ea; color: #1a7f37; }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, filter .15s;
      text-align: center;
    }

    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:not(:disabled):hover { filter: brightness(.93); }

    .btn-blue   { background: #1877f2; color: #fff; }
    .btn-green  { background: #42b72a; color: #fff; }
    .btn-stop   { background: #fff; color: #c62828; border: 1px solid #fca5a5; }
    .btn-ghost  { background: #e4e6eb; color: #1c1e21; }
    .btn-danger { background: #fff; color: #c62828; border: 1px solid #fca5a5; }

    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    /* Error */
    #errorMsg {
      display: none;
      background: #fce8e8;
      border: 1px solid #f28b82;
      color: #c62828;
      border-radius: 7px;
      padding: 8px 11px;
      font-size: 12px;
    }

    .divider { height: 1px; background: #e4e6eb; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">f</div>
    <div>
      <div class="header-title">FB Billing Scraper</div>
      <div class="header-sub">Facebook Business</div>
    </div>
  </div>

  <div class="body">

    <!-- Page context -->
    <div class="page-ctx" id="pageCtx">Đang kiểm tra trang...</div>

    <!-- Status card -->
    <div class="card">
      <div class="card-title">Trạng thái</div>
      <div class="row">
        <span class="row-label">Giao dịch (danh sách)</span>
        <span class="row-value accent" id="listCount">0</span>
      </div>
      <div class="row">
        <span class="row-label">Chi tiết đã cào</span>
        <span class="row-value green" id="detailCount">0</span>
      </div>
      <div class="row">
        <span class="row-label">Pha hiện tại</span>
        <span class="badge" id="phaseBadge"><span class="dot"></span><span id="phaseText">Chờ</span></span>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText"></div>
    </div>

    <!-- Error -->
    <div id="errorMsg"></div>

    <!-- Action buttons — shown/hidden based on state -->

    <!-- Phase 1: Scrape list -->
    <button class="btn btn-blue" id="btnScrapeList">Bắt đầu cào danh sách</button>

    <!-- Phase 2: Scrape details (shown after list done) -->
    <button class="btn btn-blue" id="btnScrapeDetail" style="display:none">Cào chi tiết từng giao dịch</button>

    <!-- Stop (shown while running) -->
    <button class="btn btn-stop" id="btnStop" style="display:none">Dừng lại</button>

    <div class="divider"></div>

    <!-- Export & Clear (shown when there's data) -->
    <div class="btn-row">
      <button class="btn btn-green" id="btnExport" disabled>Xuất Excel</button>
      <button class="btn btn-danger" id="btnClear" disabled>Xóa dữ liệu</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
